<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Plan B · Crystal Railways · Astra’s Writing Adventure</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../demo/switcher.css" />
<link rel="stylesheet" href="stage-fit.css" />
<style>
  /* Plan B "Crystal Railways": the right panel is a vintage rail ticket. Tuned for 1366x768 (scene sits under the 36px view switcher). */
  :root {
    --paper: #fbf3df;
    --paper-2: #f2e4c4;
    --brown: #4a2e1a;
    --brown-soft: #7a5638;
    --navy: #1d2b4f;
    --navy-2: #27396b;
    --ink: rgba(29, 43, 79, .78);
    --silver: #c9d1dc;
    --silver-hi: #eef2f7;
    --gold: #d9a93f;
    --gold-hi: #f3d68c;
    --cream: #fff8eb;
    --display: "Baloo 2", "Nunito", system-ui, sans-serif;
    --type: "Courier Prime", "Courier New", ui-monospace, monospace;
    --bite: 5px;      /* scallop bite radius along the long edges */
    --pitch: 22px;    /* scallop spacing */
    --notch: 14px;    /* tear-off notch radius */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font-family: var(--display); color: var(--brown); background: #1a2318; -webkit-font-smoothing: antialiased; }

  /* ---------- Scene (natural framing, same as v2) ---------- */
  .scene { position: fixed; inset: 0; overflow: hidden; container-type: size; }
  /* stage = the 1280x720 painting, cover-fitted and top-aligned (same framing as the old object-fit: cover; object-position: 50% 0) */
  .stage {
    position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    width: 1366px; height: 768px;   /* fixed design stage */
  }
  .stage > * { position: absolute; }
  .stage img { display: block; width: 100%; height: auto; }
  .stage .plate { inset: 0; width: 100%; height: 100%; }
  /* layers are placed in painting pixels (1280x720) */
  .L { left: calc(var(--x) * 100% / 1280); top: calc(var(--y) * 100% / 720); width: calc(var(--w) * 100% / 1280); }
  .train { will-change: transform; }
  .train .headlamp {
    position: absolute; left: 8.87%; top: 28.86%; width: 9.5%; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%;
    background: radial-gradient(circle, rgba(225, 245, 255, .85) 0, rgba(120, 200, 255, .45) 22%, rgba(80, 170, 255, .12) 48%, rgba(80, 170, 255, 0) 70%);
    mix-blend-mode: screen; opacity: .7; will-change: opacity; pointer-events: none;
  }
  .astra { transform-origin: 50% 97%; will-change: transform; }
  .astra-shadow {
    left: calc(548 * 100% / 1280); top: calc(646 * 100% / 720); width: calc(170 * 100% / 1280); height: calc(22 * 100% / 720);
    background: radial-gradient(closest-side, rgba(28, 14, 4, .42), rgba(28, 14, 4, .18) 60%, rgba(28, 14, 4, 0));
    transform-origin: 50% 50%;
  }
  .astra.hop { animation: astraHop 1.15s cubic-bezier(.3, .7, .4, 1) 1; }
  .astra.sway { animation: astraSway 2s ease-in-out 1; }
  .astra.boarding { animation: astraBoard .95s cubic-bezier(.45, .05, .55, 1) 1 forwards; }
  .astra-shadow.hop { animation: shadowHop 1.15s cubic-bezier(.3, .7, .4, 1) 1; }
  .astra-shadow.boarding { animation: shadowBoard .6s ease-out 1 forwards; }
  @keyframes astraHop {
    0% { transform: none; } 28% { transform: translateY(-3.2%) rotate(-2.5deg); }
    52% { transform: translateY(0) rotate(1.6deg); } 72% { transform: translateY(-.8%) rotate(-.8deg); } 100% { transform: none; }
  }
  @keyframes shadowHop { 0%, 100% { transform: none; opacity: 1; } 28% { transform: scaleX(.86); opacity: .65; } 52% { transform: none; opacity: 1; } }
  @keyframes astraSway { 0%, 100% { transform: none; } 30% { transform: rotate(-2.2deg); } 66% { transform: rotate(1.5deg); } }
  @keyframes astraBoard {
    0% { transform: none; opacity: 1; } 22% { transform: translateY(1%) scaleY(.97); opacity: 1; }
    55% { transform: translate(12%, -22%) scale(.86); opacity: 1; } 78% { transform: translate(18%, -19%) scale(.78); opacity: .8; } 100% { transform: translate(21%, -18%) scale(.72); opacity: 0; }
  }
  @keyframes shadowBoard { to { transform: scaleX(.5); opacity: 0; } }
  .fern { pointer-events: none; }
  .fx { inset: 0; width: 100%; height: 100%; pointer-events: none; }
  /* lantern glow (flicker driven from anim.js) */
  .lampglow {
    left: calc(var(--x) * 100% / 1280); top: calc(var(--y) * 100% / 720); width: calc(var(--s) * 100% / 1280);
    aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; pointer-events: none; will-change: opacity;
    background: radial-gradient(circle, rgba(255, 226, 160, .75) 0, rgba(255, 186, 90, .34) 26%, rgba(255, 160, 60, .12) 48%, rgba(255, 150, 50, 0) 70%);
    mix-blend-mode: screen; opacity: .8;
  }
  /* gold runes: a multiplied groove, a screened gold line and a blurred glow that shimmers (opacity set from anim.js) */
  .rune { left: calc(var(--x) * 100% / 1280); top: calc(var(--y) * 100% / 720); width: calc(var(--w) * 100% / 1280); aspect-ratio: 1; translate: -50% -50%; pointer-events: none; }
  .rune svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; rotate: var(--r, 0deg); fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .rune .carve { mix-blend-mode: multiply; stroke: #3c210c; stroke-width: 3.6; opacity: .62; translate: .4% .9%; }
  .rune .gold { mix-blend-mode: screen; stroke: #e9b44c; stroke-width: 1.7; opacity: .78; }
  .rune .glow { mix-blend-mode: screen; stroke: #ffc75a; stroke-width: 4.5; filter: blur(2.6px); opacity: .32; will-change: opacity; transition: opacity 2.4s ease-in-out; }
  .scene::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(420px 150px at 0 0, rgba(10, 16, 12, .45), rgba(10, 16, 12, 0) 75%),
      linear-gradient(270deg, rgba(14, 18, 34, .30) 0, rgba(14, 18, 34, 0) 460px);
  }

  /* ---------- View switcher (../demo/switcher.js adds html.vs-on and a 36px bar) ---------- */
  /* the switcher sits above the 1366x768 stage (stage-fit.css/js), so nothing inside is offset for it */

  /* ---------- Title ---------- */
  .title { position: absolute; left: 14px; top: 8px; z-index: 3; display: flex; align-items: center; gap: 9px; }
  .title svg { width: 24px; height: 32px; filter: drop-shadow(0 0 6px rgba(120, 200, 255, .7)); }
  .title h1 {
    margin: 0; padding-top: 5px; font-weight: 800; font-size: 31px; line-height: 1; letter-spacing: .01em;
    background: linear-gradient(180deg, #fff6dc 10%, #f2cf7a 85%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 0 rgba(58, 34, 14, .85)) drop-shadow(0 3px 8px rgba(0, 0, 0, .5));
  }
  .title small {
    display: block; margin-top: 1px; font-size: 14px; font-weight: 700; letter-spacing: .03em;
    -webkit-text-fill-color: var(--cream); text-shadow: 0 1px 3px rgba(0, 0, 0, .75);
  }

  /* ---------- Ticket ---------- */
  .ticket {
    position: absolute; right: 18px; top: 50%; translate: 0 -50%; width: 440px; z-index: 3;
    /* card resting on the scene: shadow follows the die-cut silhouette */
    filter: drop-shadow(0 2px 1.5px rgba(30, 18, 6, .35)) drop-shadow(0 14px 20px rgba(6, 10, 24, .5));
  }
  .paper {
    position: relative;
    background:
      /* paper grain (feTurbulence noise, very low alpha) */
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32  0 0 0 0 .22  0 0 0 0 .1  0 0 0 .16 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
      radial-gradient(120% 60% at 20% 0%, rgba(255, 255, 255, .6), rgba(255, 255, 255, 0) 60%),
      radial-gradient(80% 50% at 100% 100%, rgba(205, 170, 110, .22), rgba(205, 170, 110, 0) 70%),
      linear-gradient(180deg, var(--paper), var(--paper-2));
    /* die cut: scalloped long edges (mask layers are intersected) */
    -webkit-mask-image:
      radial-gradient(circle at 0 50%, transparent var(--bite), #000 calc(var(--bite) + .5px)),
      radial-gradient(circle at 100% 50%, transparent var(--bite), #000 calc(var(--bite) + .5px)),
      var(--cut-a), var(--cut-b), var(--cut-c, linear-gradient(#000, #000)), var(--perf-cut);
            mask-image:
      radial-gradient(circle at 0 50%, transparent var(--bite), #000 calc(var(--bite) + .5px)),
      radial-gradient(circle at 100% 50%, transparent var(--bite), #000 calc(var(--bite) + .5px)),
      var(--cut-a), var(--cut-b), var(--cut-c, linear-gradient(#000, #000)), var(--perf-cut);
    -webkit-mask-size: 100% var(--pitch), 100% var(--pitch), 100% 100%, 100% 100%, 100% 100%, 10px 100%;
            mask-size: 100% var(--pitch), 100% var(--pitch), 100% 100%, 100% 100%, 100% 100%, 10px 100%;
    -webkit-mask-repeat: repeat-y, repeat-y, no-repeat, no-repeat, no-repeat, repeat-x;
            mask-repeat: repeat-y, repeat-y, no-repeat, no-repeat, no-repeat, repeat-x;
    -webkit-mask-position: 0 calc(var(--pitch) / 2), 0 calc(var(--pitch) / 2), 0 0, 0 0, 0 0, 5px 0;
            mask-position: 0 calc(var(--pitch) / 2), 0 calc(var(--pitch) / 2), 0 0, 0 0, 0 0, 5px 0;
    -webkit-mask-composite: source-in; mask-composite: intersect;
  }
  /* printed double-rule frame */
  .paper::before {
    content: ""; position: absolute; inset: 11px 13px; pointer-events: none; z-index: 0;
    border: 3.5px double var(--ink); border-radius: 9px;
  }
  .main {
    border-radius: 16px 16px 0 0;
    padding: 17px 21px 12px;
    --cut-a: radial-gradient(circle at 0 100%, transparent var(--notch), #000 calc(var(--notch) + .5px));
    --cut-b: radial-gradient(circle at 100% 100%, transparent var(--notch), #000 calc(var(--notch) + .5px));
    --perf-cut: radial-gradient(circle at 50% 100%, transparent 2.2px, #000 2.7px);
  }
  .main::before { bottom: 6px; }
  .main > * { position: relative; z-index: 1; }

  /* faint guilloche + crystal watermark behind the body */
  .security {
    position: absolute !important; z-index: 0 !important; left: 17px; right: 17px; top: 120px; bottom: 10px;
    pointer-events: none; border-radius: 6px;
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='72' height='18'><path d='M0 9 C9 1 18 1 27 9 S45 17 54 9 S63 1 72 9' fill='none' stroke='%231d2b4f' stroke-opacity='.07' stroke-width='1'/><path d='M0 9 C9 17 18 17 27 9 S45 1 54 9 S63 17 72 9' fill='none' stroke='%231d2b4f' stroke-opacity='.05' stroke-width='1'/></svg>");
    -webkit-mask-image: radial-gradient(75% 60% at 50% 50%, #000 30%, transparent 100%);
            mask-image: radial-gradient(75% 60% at 50% 50%, #000 30%, transparent 100%);
  }
  .watermark {
    position: absolute !important; z-index: 0 !important; left: 50%; top: 175px; translate: -50% 0;
    width: 230px; height: 306px; opacity: .05; pointer-events: none;
  }

  /* header band */
  .band {
    position: relative; display: flex; align-items: center; gap: 12px;
    padding: 9px 14px 9px 10px; border-radius: 6px;
    background:
      repeating-linear-gradient(135deg, rgba(255, 255, 255, .04) 0 2px, rgba(255, 255, 255, 0) 2px 7px),
      linear-gradient(180deg, var(--navy-2), var(--navy));
    box-shadow: inset 0 0 0 2px var(--navy), inset 0 0 0 3px rgba(201, 209, 220, .7);
  }
  .emblem {
    flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, #34497f, #16213f);
    border: 2px solid var(--silver); box-shadow: 0 0 0 2px var(--navy), 0 0 0 3px rgba(201, 209, 220, .5);
  }
  .emblem svg { width: 18px; height: 24px; filter: drop-shadow(0 0 4px rgba(120, 200, 255, .8)); }
  .brand { flex: 1; min-width: 0; }
  .brand .rr {
    margin: 0; font-size: 20px; font-weight: 800; line-height: 1.05; letter-spacing: .2em; color: var(--silver-hi);
  }
  .brand .kinds { margin: 3px 0 0; display: flex; gap: 6px; }
  .kind {
    font-size: 13px; font-weight: 800; letter-spacing: .14em; line-height: 18px; padding: 0 7px;
    color: var(--gold-hi); border: 1.25px solid rgba(243, 214, 140, .75); border-radius: 3px;
  }

  /* printed fields under the band */
  .fields {
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 7px 2px 0; padding-bottom: 6px; border-bottom: 1.5px solid rgba(29, 43, 79, .35);
    font-family: var(--type); font-weight: 700; font-size: 14px; letter-spacing: .02em; color: var(--navy);
  }
  .fields .serial { color: #8a2d1f; letter-spacing: .06em; }
  .fields .k { font-weight: 400; color: var(--brown-soft); }

  /* next stop */
  .nextstop { display: flex; align-items: center; gap: 14px; padding: 14px 2px 14px; border-bottom: 1.5px dotted rgba(122, 86, 56, .5); }
  .nextstop .ico { flex: none; width: 50px; height: 52px; display: block; filter: drop-shadow(0 2px 2px rgba(40, 26, 12, .3)); }
  .nextstop .kicker { margin: 0; font-size: 14px; font-weight: 800; letter-spacing: .16em; line-height: 1.2; color: #94690f; }
  .nextstop .place { margin: 1px 0 0; font-size: 30px; font-weight: 800; line-height: 1.02; color: var(--navy); }
  .nextstop .lesson { margin: 4px 0 0; font-size: 17px; font-weight: 700; line-height: 1.2; color: var(--brown); }
  .lbl { margin: 0; font-size: 14px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--navy-2); line-height: 1.2; }

  .sec { padding: 10px 2px 11px; border-bottom: 1.5px dotted rgba(122, 86, 56, .5); }
  .txt { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.25; color: var(--brown); }
  .goal .txt { margin-top: 3px; }

  /* stops grid */
  .stops { padding: 10px 2px 0; }
  .stops .head { display: flex; align-items: baseline; justify-content: space-between; }
  .count { font-family: var(--type); font-weight: 700; font-size: 14px; color: var(--brown-soft); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 4px; margin-top: 8px; }
  .world {
    position: relative; display: grid; justify-items: center; padding: 6px 0 3px;
    border: 0; border-radius: 12px; background: none; font: inherit; color: var(--brown); cursor: pointer;
  }
  .medal { position: relative; width: 64px; height: 66px; }
  .medal img { width: 64px; height: 66px; display: block; filter: drop-shadow(0 2px 2px rgba(40, 26, 12, .3)); }
  .wname { margin-top: 3px; font-size: 15px; font-weight: 800; line-height: 1.1; white-space: nowrap; color: var(--navy); }
  .wmod { font-size: 14px; font-weight: 700; line-height: 1.2; color: var(--brown-soft); }
  /* finished = conductor's punch: a punched hole ringed in silver with a check */
  .punch {
    position: absolute; right: -6px; top: 36px; width: 25px; height: 25px; border-radius: 50%;
    display: grid; place-items: center;
    background: radial-gradient(circle at 50% 40%, #2b3d6e, #121b33);
    box-shadow: 0 0 0 2px #dfe5ee, 0 0 0 3px rgba(29, 43, 79, .55), inset 0 2px 3px rgba(0, 0, 0, .6);
  }
  .punch svg { width: 13px; height: 13px; display: block; }
  .world.next { background: rgba(243, 214, 140, .26); box-shadow: inset 0 0 0 1.5px rgba(217, 169, 63, .6); }
  .world.next .medal::before {
    content: ""; position: absolute; left: -4px; top: -4px; width: 72px; height: 72px; border-radius: 50%;
    border: 3px solid var(--gold); box-shadow: 0 0 9px rgba(243, 214, 140, .8);
  }
  .world.next .wmod { color: #94690f; }
  .nexttag {
    position: absolute; left: 50%; top: -10px; translate: -50% 0; z-index: 2;
    padding: 0 8px; border-radius: 999px; white-space: nowrap;
    font-size: 13px; font-weight: 800; line-height: 18px; letter-spacing: .06em;
    background: var(--navy); color: var(--gold-hi); border: 1.5px solid var(--gold);
  }

  /* every stop is live now; .soon (a small "Coming soon" note) is kept for future stops */
  .world.soon { cursor: default; }
  .world.soon::after {
    content: "Coming soon"; position: absolute; left: 50%; top: 22px; translate: -50% 0; z-index: 3; pointer-events: none;
    padding: 2px 9px; border-radius: 999px; white-space: nowrap; font-size: 13px; font-weight: 800; line-height: 18px; letter-spacing: .03em;
    background: var(--navy); color: var(--cream); border: 1.5px solid var(--silver);
    opacity: 0; transition: opacity .18s ease;
  }
  .world.soon:hover::after, .world.soon:focus-visible::after, .world.soon.tip::after { opacity: 1; }
  .world.go { cursor: pointer; }
  .world.go:focus-visible, .board:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .world.next { box-shadow: inset 0 0 0 1.5px rgba(217, 169, 63, .75), 0 0 12px rgba(243, 214, 140, .45); }
  .punchring {
    position: absolute; z-index: 4; width: 30px; height: 30px; translate: -50% -50%; border-radius: 50%; pointer-events: none;
    border: 2.5px solid rgba(29, 43, 79, .55); opacity: 0;
  }
  .punchring.go { animation: punchRing .42s ease-out 1 forwards; }
  @keyframes punchRing { 0% { transform: scale(1.7); opacity: 0; } 40% { transform: scale(1); opacity: 1; } 100% { transform: scale(.9); opacity: 0; } }
  .ticket.press .main { animation: ticketPress .3s ease-out 1; }
  @keyframes ticketPress { 0%, 100% { transform: none; } 35% { transform: translateY(2px) rotate(-.25deg); } }
  .chad {
    position: fixed; z-index: 50; width: 16px; height: 16px; translate: -50% -50%; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle at 40% 35%, #fffaf0, var(--paper-2)); box-shadow: 0 1px 2px rgba(40, 26, 12, .45);
    animation: chadFall 1.1s cubic-bezier(.5, 0, .8, .6) 1 forwards;
  }
  @keyframes chadFall {
    0% { transform: translate(0, 0) rotate(0) scaleY(1); opacity: 1; }
    30% { transform: translate(6px, 26px) rotate(140deg) scaleY(.55); }
    60% { transform: translate(-4px, 80px) rotate(300deg) scaleY(.9); opacity: 1; }
    100% { transform: translate(5px, 170px) rotate(480deg) scaleY(.5); opacity: 0; }
  }
  .portal { position: absolute; inset: 0; width: 1366px; height: 768px; object-fit: cover; opacity: 0; pointer-events: none;
    z-index: 880; transition: opacity .3s ease; background: #071426; }
  .portal.on { opacity: 1; }
  .depart-fade {
    position: absolute; inset: 0; z-index: 900; pointer-events: none; opacity: 0; transition: opacity .7s ease;
    background: radial-gradient(120% 90% at 50% 40%, #f3d9a6, #d9a466 70%, #b77a44);
  }
  .depart-fade.on { opacity: 1; pointer-events: auto; }
  /* video depart: the chosen world's painting (cover, like the world page) fades in over the last 0.8s of the film */
  .depart-fade.to-world { background: #1a2318 center / cover no-repeat; transition: opacity .8s ease; }
  @media (prefers-reduced-motion: reduce) {
    .astra.hop, .astra.sway, .astra-shadow.hop, .punchring.go, .ticket.press .main { animation: none; }
    .rune .glow { transition: none; }
    .chad { display: none; }
  }

  /* ---------- Stub ---------- */
  .stub {
    border-radius: 0 0 16px 16px;
    padding: 15px 21px 15px 20px;
    display: grid; grid-template-columns: 26px 16px 1fr 64px; align-items: center; gap: 0 10px;
    --cut-a: radial-gradient(circle at 0 0, transparent var(--notch), #000 calc(var(--notch) + .5px));
    --cut-b: radial-gradient(circle at 100% 0, transparent var(--notch), #000 calc(var(--notch) + .5px));
    --perf-cut: radial-gradient(circle at 50% 0, transparent 2.2px, #000 2.7px);
    /* conductor's punched hole on the stub */
    --cut-c: radial-gradient(circle at 34px 50%, transparent 7px, #000 7.5px);
  }
  .stub::before { top: 6px; }
  .stub > * { position: relative; z-index: 1; }
  .perf {
    position: absolute; left: calc(var(--notch) + 6px); right: calc(var(--notch) + 6px); top: 0; height: 0; z-index: 2;
    height: 4px; background: linear-gradient(rgba(74, 46, 26, .10), rgba(74, 46, 26, 0));
  }
  .admit {
    justify-self: center; align-self: stretch; display: flex; align-items: center; justify-content: center;
    writing-mode: vertical-rl; rotate: 180deg;
    font-size: 13px; font-weight: 800; letter-spacing: .1em; color: var(--navy); line-height: 1;
  }
  .board {
    height: 52px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: linear-gradient(180deg, var(--navy-2), var(--navy));
    border: 2px solid var(--silver);
    box-shadow: inset 0 0 0 2px var(--navy), inset 0 0 0 3px rgba(238, 242, 247, .35), 0 4px 10px rgba(16, 24, 48, .35);
    font: inherit; font-size: 20px; font-weight: 800; letter-spacing: .02em; color: var(--cream); cursor: pointer;
  }
  .board svg { width: 20px; height: 20px; }
  .stamp { width: 64px; height: 64px; rotate: -14deg; opacity: .32; justify-self: end; }
/* ===== Plan B intro drop-in (dash-anim/1_PASTE_INTO_index_html_STYLE.css): video under the ticket UI ===== */
.stage .intro-bg {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; object-position: 50% 0;
  z-index: 0; pointer-events: none;
  background: #1a2318;
}
.ticket { z-index: 5 !important; }
.title { z-index: 5 !important; }
.scene.intro-playing .plate,
.scene.intro-playing .train,
.scene.intro-playing .astra,
.scene.intro-playing .astra-shadow,
.scene.intro-playing .fern,
.scene.intro-playing .fx,
.scene.intro-playing .lampglow,
.scene.intro-playing .rune {
  opacity: 0 !important;
  visibility: hidden;
}
.scene.intro-done .intro-bg { opacity: 1; }
.scene.intro-done .plate { opacity: 0; }
/* ===== END PASTE ===== */

  /* Video-mode follow-up (per ANIM_NOTE): once the intro has played, and while the depart video runs, the video IS the scene.
     Keep the plate-aligned sprite layers hidden so the CSS train/Astra never double up with the filmed ones.
     anim.js only runs ambient effects (steam from the filmed stack, fireflies, leaves, lantern flicker) after "crystal-intro-done". */
  .scene.intro-done .train, .scene.intro-done .astra, .scene.intro-done .astra-shadow, .scene.intro-done .fern, .scene.intro-done .rune,
  .scene.depart-playing .plate, .scene.depart-playing .train, .scene.depart-playing .astra, .scene.depart-playing .astra-shadow,
  .scene.depart-playing .fern, .scene.depart-playing .rune, .scene.depart-playing .lampglow, .scene.depart-playing .fx,
  .scene.depart-done .plate, .scene.depart-done .train, .scene.depart-done .astra, .scene.depart-done .astra-shadow,
  .scene.depart-done .fern, .scene.depart-done .rune, .scene.depart-done .lampglow, .scene.depart-done .fx {
    opacity: 0 !important; visibility: hidden;
  }
  .scene.intro-done .fx, .scene.intro-done .lampglow { transition: opacity .8s ease; }
  .world.go:not(.next):hover { background: rgba(243, 214, 140, .16); }

  /* ---------- Start gate: the intro waits for a tap so it can play from 0 with sound (speech in sync) ---------- */
  .intro-gate { position: absolute; inset: 0; z-index: 60; display: grid; place-items: center; transition: opacity .45s ease; }
  .intro-gate.gone { opacity: 0; pointer-events: none; }
  .intro-gate[hidden] { display: none; }
  .start-btn {
    display: grid; justify-items: center; gap: 2px; padding: 16px 38px 13px; border-radius: 22px; cursor: pointer;
    background: rgba(255, 248, 235, .82); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, .95); color: #4a2e1a; font-family: var(--display);
    box-shadow: 0 14px 34px -12px rgba(20, 12, 4, .6); transition: translate .2s ease, box-shadow .2s ease;
  }
  .start-btn svg { width: 22px; height: 30px; filter: drop-shadow(0 0 6px rgba(120, 200, 255, .7)); margin-bottom: 2px; }
  .start-btn .big { font-size: 34px; font-weight: 800; line-height: 1; }
  .start-btn .small { font-size: 16px; font-weight: 700; color: #7a5638; line-height: 1.2; }
  .start-btn:hover { translate: 0 -2px; box-shadow: 0 18px 38px -12px rgba(20, 12, 4, .65); }
  .start-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

  /* ---------- Ticket + title stay out of the way of the videos ---------- */
  /* while the intro plays (body.ui-away) they wait off-screen, then slide in when it ends */
  .ticket, .title { transition: transform .9s cubic-bezier(.22, .8, .3, 1), opacity .7s ease; }
  body.ui-away .ticket { transform: translateX(calc(100% + 60px)); opacity: 0; pointer-events: none; }
  body.ui-away .title { transform: translateY(-150%); opacity: 0; pointer-events: none; }
  /* boarding: the ticket lifts, tilts and swoops off to the upper right, then the depart video runs unobstructed */
  body.ui-flyoff .ticket { animation: ticketFly .8s cubic-bezier(.45, 0, .7, .2) 1 forwards; pointer-events: none; }
  body.ui-flyoff .title { transform: translateY(-150%); opacity: 0; pointer-events: none; }
  @keyframes ticketFly {
    0% { transform: none; opacity: 1; }
    22% { transform: translate(-6px, -16px) rotate(-2.5deg) scale(1.02); opacity: 1; }
    100% { transform: translate(calc(100% + 180px), -320px) rotate(16deg) scale(.88); opacity: 0; }
  }

  /* ---------- Stop selection (pick a stop, then board) ---------- */
  .world.sel { background: rgba(39, 57, 107, .10); box-shadow: inset 0 0 0 2px rgba(29, 43, 79, .7); }
  .world.next.sel { box-shadow: inset 0 0 0 2px rgba(29, 43, 79, .7), 0 0 12px rgba(243, 214, 140, .45); }
  .world.sel .medal::after {
    content: ""; position: absolute; left: -4px; top: -4px; width: 72px; height: 72px; border-radius: 50%; pointer-events: none;
    border: 3px solid var(--navy-2); box-shadow: 0 0 0 1.5px rgba(238, 242, 247, .9), 0 0 8px rgba(39, 57, 107, .45);
  }
  .world.sel .wname { text-decoration: underline 2px rgba(29, 43, 79, .45); text-underline-offset: 3px; }
  .world.pick { animation: pickPress .28s ease-out 1; }
  @keyframes pickPress { 0%, 100% { transform: none; } 40% { transform: translateY(2px) scale(.97); } }
  .board { flex-direction: row; }
  .board .bt { display: grid; justify-items: start; line-height: 1.05; }
  .board .bt small { font-size: 13px; font-weight: 700; letter-spacing: .02em; color: var(--gold-hi); }
  .board:disabled { opacity: .55; cursor: default; }
  @media (prefers-reduced-motion: reduce) {
    .ticket, .title { transition: opacity .3s ease; }
    body.ui-away .ticket, body.ui-away .title, body.ui-flyoff .title { transform: none; }
    body.ui-flyoff .ticket { animation: none; opacity: 0; }
    .world.pick { animation: none; }
  }

  /* ---------- Video framing (intro-controller.js): the filmed scene is shown whole (contain-fit, never cover-cropped),
     so Astra is full-body and the whole locomotive is visible at any window size. Any area the frame doesn't cover is
     filled by a blurred, darkened copy of the current frame (#vfill), never black bars. After the intro the stage eases
     (1s, no bounce) so the locomotive and Astra sit left of the ticket. ---------- */
  .vfill { position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); z-index: 0; pointer-events: none;
    filter: blur(26px) brightness(.55) saturate(1.1); opacity: 0; transition: opacity .4s ease; }
  .scene.vmode .vfill { opacity: 1; }
  .scene.vmode .stage {
    left: var(--vx, 0px); top: var(--vy, 0px); width: var(--vw, 100cqw);
    transform: translate(var(--dx, 0px), var(--dy, 0px)) scale(var(--k, 1)); transform-origin: 0 0;
    transition: transform 1s cubic-bezier(.33, 0, .2, 1);
  }
  .scene.vmode .stage .intro-bg { object-fit: fill; background: transparent; }
  .scene.vmode.vnoease .stage { transition: none; }
  @media (prefers-reduced-motion: reduce) { .scene.vmode .stage { transition: none; } }

  /* ---------- "Through the tunnel" loader (tunnel.js): train-window view, then the light opens into the world ---------- */
  .tunnel { position: absolute; inset: 0; z-index: 850; overflow: hidden; opacity: 0; transition: opacity .35s ease; background: #262350; }
  .tunnel.on { opacity: 1; }
  .tunnel canvas { position: absolute; inset: 0; width: 100%; height: 100%; will-change: transform;
    scale: 1.16; transition: scale .6s cubic-bezier(.2, .7, .3, 1); }
  .tunnel.on canvas { scale: 1.05; }          /* whoosh: the window view rushes in */
  .tunnel-art { position: absolute; inset: 0; background: #f6eedb center / cover no-repeat; opacity: 0; transition: opacity .55s ease; }
  .tunnel.arrive .tunnel-art { opacity: 1; }
  .tunnel-window {
    position: absolute; inset: 0; pointer-events: none; transition: opacity .5s ease, scale .55s ease;
    will-change: transform;
  }
  .tunnel-window::before {   /* navy carriage wall around a rounded window opening, brass rim */
    content: ""; position: absolute; left: 92px; top: 62px; right: 92px; bottom: 62px; border-radius: 54px;
    border: 7px solid #c9a24a; box-shadow: 0 0 0 3px #7a5a1f, 0 0 0 400px #1f2d5c, inset 0 0 0 3px rgba(255, 230, 160, .55), inset 0 0 26px rgba(10, 12, 40, .45);
  }

  }

    background: radial-gradient(circle at 35% 30%, #fff1c2, #d9ae55 45%, #7a5a1f 100%); box-shadow: 0 1px 2px rgba(0, 0, 0, .5);
  }

  .tunnel-window i:nth-child(3) { left: 1320px; top: 36px; } .tunnel-window i:nth-child(4) { left: 1322px; top: 384px; }
