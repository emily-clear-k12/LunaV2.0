<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Plan D · Forest Guides · Astra’s Writing Adventure</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Lilita+One&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../demo/lonestar-brand.css" />
<link rel="stylesheet" href="../demo/switcher.css" />
<style>
  /* Plan D "Forest Guides": treehouse porch + numbered signpost. Full-bleed scene + frosted cream overlays.
     Tuned for 1366x768. Panels sit in the open tree (top left) and sky (top right), clear of every character and the signpost. */
  :root {
    --frost: rgba(255, 248, 235, .82);
    --brown: #4a2e1a;
    --brown-soft: #7a5638;
    --gold: #d9a93f;
    --gold-deep: #94690f;
    --ls-sans: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --ls-serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --ls-game: "Lilita One", "Manrope", system-ui, sans-serif;
    --display: "Manrope", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { font-family: var(--display); color: var(--brown); -webkit-font-smoothing: antialiased; background: #2a3320; }

  /* ---------- Scene: viewport area under the view switcher ---------- */
  .scene { position: fixed; left: 0; right: 0; bottom: 0; top: 0; overflow: hidden; container-type: size; }
  /* View switcher (../demo/switcher.js adds html.vs-on and a 36px bar) */
  html.vs-on .scene { top: var(--vs-h); }
  html.vs-on .top { top: calc(var(--vs-h) + 12px); }
  html.vs-on .go { top: calc(var(--vs-h) + 12px); }

  /* Stage = exactly the "cover" box of the 16:9 art (1280x720), so hotspots stay glued to the painted arrows */
  .stage {
    position: absolute; left: 50%; top: 50%;
    width: max(100cqw, 177.7778cqh); height: max(100cqh, 56.25cqw);
    transform: translate(-50%, -50%);
    background: url("assets/bg/day.jpg") center / 100% 100% no-repeat;
  }
  .fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .fx .halo { mix-blend-mode: screen; }
  .fx .lift { mix-blend-mode: soft-light; }
  .fx .rim  { mix-blend-mode: screen; }

  /* Arrow hotspots: clip-path polygons fitted to each painted arrow (static; no looping animation) */
  .hot {
    position: absolute; margin: 0; padding: 0; border: 0; cursor: pointer;
    background: rgba(255, 244, 214, 0); mix-blend-mode: screen;
    transition: background-color .18s ease;
  }
  .hot:hover { background: rgba(255, 244, 214, .16); }
  .hot:focus-visible { outline: none; background: rgba(255, 244, 214, .26); }
  .hot.is-current:hover { background: rgba(255, 236, 180, .10); }

  /* ---------- Frosted UI ---------- */
  .frost {
    background: var(--frost);
    -webkit-backdrop-filter: blur(10px) saturate(1.1); backdrop-filter: blur(10px) saturate(1.1);
    border: 1px solid rgba(255, 255, 255, .85);
    border-radius: 16px;
    box-shadow: 0 6px 18px rgba(30, 20, 8, .28), 0 1px 2px rgba(30, 20, 8, .18);
  }
  /* top left, over the big tree (above the owl and raccoon) */
  .top {
    position: absolute; top: 12px; left: 14px; width: 440px;
    display: grid; grid-template-columns: 1fr; gap: 8px;
  }
  .title {
    justify-self: start;
    display: flex; align-items: center; gap: 9px;
    padding: 5px 16px 4px 12px; border-radius: 999px;
  }
  .title svg { width: 18px; height: 24px; flex: none; filter: drop-shadow(0 0 4px rgba(120, 200, 255, .7)); }
  .title h1 { margin: 0; font-family: var(--ls-serif); font-size: 25px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; white-space: nowrap; }
  .card { padding: 8px 14px 10px; }
  .lbl {
    margin: 0; display: flex; align-items: center; gap: 6px;
    font-size: 13.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; line-height: 1.2; color: var(--gold-deep);
  }
  .lbl svg { width: 14px; height: 14px; flex: none; }
  .txt { margin: 3px 0 0; font-size: 17px; font-weight: 700; line-height: 1.22; color: var(--brown); }

  /* top right, in the open sky between the signpost and the right-hand tree */
  .go {
    position: absolute; right: 14px; top: 12px;
    display: flex; align-items: center; gap: 14px;
    padding: 8px 8px 8px 16px; border-radius: 20px;
  }
  .world .kicker { margin: 0; display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; line-height: 1.2; color: var(--gold-deep); }
  .world .kicker svg { width: 15px; height: 15px; flex: none; filter: drop-shadow(0 0 3px rgba(255, 196, 60, .8)); }
  .world .place { margin: 0; font-family: var(--ls-serif); font-size: 23px; font-weight: 700; line-height: 1.1; letter-spacing: -0.01em; white-space: nowrap; }
  .world .lesson { margin: 1px 0 0; font-size: 16px; font-weight: 700; line-height: 1.2; color: var(--brown-soft); white-space: nowrap; }
  .hop {
    display: flex; align-items: center; gap: 10px;
    height: 54px; padding: 0 16px 0 20px; border-radius: 16px; cursor: pointer;
    font: inherit; font-size: 23px; font-weight: 800; letter-spacing: .01em; color: #fffaf0; white-space: nowrap;
    text-shadow: 0 1px 0 rgba(90, 52, 14, .6);
    background: linear-gradient(180deg, #edc25c 0%, #d39a33 55%, #b47a22 100%);
    border: 2px solid #fff3d2;
    box-shadow: 0 0 0 2px #8a5a1c, 0 5px 0 #6e4614, 0 9px 16px rgba(40, 22, 6, .4), inset 0 2px 0 rgba(255, 255, 255, .45);
  }
  .hop svg { width: 22px; height: 22px; }
  .hop:hover { filter: brightness(1.05); }
  .hop:active { translate: 0 3px; box-shadow: 0 0 0 2px #8a5a1c, 0 2px 0 #6e4614, 0 4px 8px rgba(40, 22, 6, .4), inset 0 2px 0 rgba(255, 255, 255, .45); }

  /* Compact panels keep the signpost and animal friends clear. */
  .top { width:350px; gap:6px; }
  .title { padding:4px 10px; }
  .title h1 { font-size:20px; }
  .title svg { width:14px; height:20px; }
  .card { padding:6px 10px; }
  .lbl { font-size:11px; }
  .txt { font-size:14px; line-height:1.3; }
  .go { width:286px; display:grid; grid-template-columns:1fr; gap:6px; padding:8px 10px; border-radius:14px; }
  .world { min-width:0; }
  .world .kicker { font-size:11px; }
  .world .place { font-size:17px; line-height:1.2; white-space:normal; }
  .world .lesson { display:none; }
  .hop { position:fixed; right:14px; bottom:calc(18px + env(safe-area-inset-bottom, 0px)); z-index:6; height:36px; padding:0 12px; font-size:16px; border-radius:10px; }
  .hop svg { width:18px; height:18px; }
  @media (max-width:760px) {
    .top { width:250px; max-width:calc(50% - 20px); }
    .title h1 { font-size:16px; white-space:normal; }
    .go { width:230px; max-width:calc(50% - 20px); }
    .world .place { font-size:15px; }
  }
</style>
</head>
<body>
<script src="../demo/switcher.js" data-page="dashboard-d"></script>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gLit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfe9ff"/><stop offset=".45" stop-color="#5bb4f5"/><stop offset="1" stop-color="#1f5fbf"/>
    </linearGradient>
    <symbol id="crystal-lit" viewBox="0 0 24 32">
      <polygon points="12,1 22,10 12,31 2,10" fill="url(#gLit)" stroke="#1b4f9e" stroke-width="1.2" stroke-linejoin="round"/>
      <polygon points="12,1 22,10 12,13 2,10" fill="#d9f3ff" opacity=".75"/>
      <polyline points="2,10 12,13 22,10" fill="none" stroke="#1b4f9e" stroke-width=".9" opacity=".6"/>
      <line x1="12" y1="13" x2="12" y2="31" stroke="#ffffff" stroke-width=".9" opacity=".45"/>
    </symbol>
  </defs>
</svg>

<div class="scene">
<main class="stage" aria-label="Treehouse porch signpost: pick a world">
  <!-- Coordinates below are in the art's own pixels (1280x720); the stage is the art's cover box. -->
  <svg class="fx" viewBox="0 0 1280 720" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <filter id="fHalo" x="-60%" y="-120%" width="220%" height="340%"><feGaussianBlur stdDeviation="9"/></filter>
      <filter id="fSoft" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="1.5"/></filter>
      <mask id="mOut" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="720">
        <rect width="1280" height="720" fill="#fff"/>
        <polygon points="820,414 819,370 809,363 798,364 795,370 706,366 680,389 680,394 707,419 818,419" fill="#000" filter="url(#fSoft)"/>
      </mask>
      <radialGradient id="gLift" cx=".5" cy=".45" r=".7">
        <stop offset="0" stop-color="#fff6d6"/><stop offset="1" stop-color="#ffd978"/>
      </radialGradient>
    </defs>
    <!-- soft, static golden glow on arrow 5 (the yellow star = current world); halo kept off the arrow face so the star stays crisp -->
    <g class="halo" mask="url(#mOut)">
      <polygon points="820,414 819,370 809,363 798,364 795,370 706,366 680,389 680,394 707,419 818,419" fill="#ffb935" stroke="#ffc94f" stroke-width="15" stroke-linejoin="round" filter="url(#fHalo)" opacity=".95"/>
    </g>
    <!-- slight brightness lift on the arrow face -->
    <polygon class="lift" points="820,414 819,370 809,363 798,364 795,370 706,366 680,389 680,394 707,419 818,419" fill="url(#gLift)" opacity=".85"/>
    <!-- thin warm rim -->
    <polygon class="rim" points="820,414 819,370 809,363 798,364 795,370 706,366 680,389 680,394 707,419 818,419" fill="none" stroke="#ffe39a" stroke-width="2" stroke-linejoin="round" opacity=".75" filter="url(#fSoft)"/>
  </svg>
  <button class="hot" type="button" data-world="shell" data-arrow="1" aria-label="Arrow 1: Shell world (bear's world)" style="left:53.516%;top:11.389%;width:12.500%;height:9.722%;clip-path:polygon(0% 0%, 88% 0%, 100% 50%, 88% 100%, 0% 100%)"></button>
  <button class="hot" type="button" data-world="leaf" data-arrow="2" aria-label="Arrow 2: Maple Leaf world (raccoon's world)" style="left:53.828%;top:22.222%;width:13.359%;height:8.333%;clip-path:polygon(0% 0%, 88% 0%, 100% 50%, 88% 100%, 0% 100%)"></button>
  <button class="hot" type="button" data-world="gem" data-arrow="3" aria-label="Arrow 3: Gem world (owl's world)" style="left:54.297%;top:31.250%;width:12.891%;height:9.028%;clip-path:polygon(0% 0%, 88% 0%, 100% 50%, 88% 100%, 0% 100%)"></button>
  <button class="hot" type="button" data-world="carrot" data-arrow="4" aria-label="Arrow 4: Carrot world (fox's world)" style="left:53.281%;top:40.972%;width:11.719%;height:8.333%;clip-path:polygon(13% 0%, 100% 0%, 100% 100%, 13% 100%, 0% 50%)"></button>
  <button class="hot is-current" type="button" data-world="star" data-arrow="5" aria-current="true" aria-label="Arrow 5: Starlight Observatory (squirrel's world) — you are here" style="left:53.047%;top:50.972%;width:11.172%;height:7.639%;clip-path:polygon(13% 0%, 100% 0%, 100% 100%, 13% 100%, 0% 50%)"></button>
  <button class="hot" type="button" data-world="cupcake" data-arrow="6" aria-label="Arrow 6: Cupcake world (rabbit's world)" style="left:53.047%;top:60.417%;width:11.406%;height:7.639%;clip-path:polygon(13% 0%, 100% 0%, 100% 100%, 13% 100%, 0% 50%)"></button>
</main>
</div>

<div class="top">
  <header class="title frost">
    <svg aria-hidden="true"><use href="#crystal-lit"/></svg>
    <h1>Astra’s Writing Adventure</h1>
  </header>
  <section class="card frost" aria-label="Today's goal">
    <p class="lbl"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="#d9a93f" stroke-width="2"/><circle cx="8" cy="8" r="2.6" fill="#d9a93f"/></svg>Today’s goal</p>
    <p class="txt">Back up my opinion with strong, specific reasons.</p>
  </section>
</div>

<aside class="go frost" aria-label="Selected module">
  <div class="world">
    <p class="kicker"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.2 10.1 5.6 14.9 6.2 11.4 9.5 12.3 14.3 8 11.9 3.7 14.3 4.6 9.5 1.1 6.2 5.9 5.6Z" fill="#f2bf2f" stroke="#b9860f" stroke-width=".9" stroke-linejoin="round"/></svg>Writing module</p>
    <p class="place">Extended Constructed Response</p>
    <p class="lesson">Module 2: Write a longer answer</p>
  </div>
</aside>
<button class="hop" type="button">Let’s go!
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11M11 5.5 15.5 10 11 14.5" fill="none" stroke="#fffaf0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
<script src="../demo/module-titles.js"></script><script src="../demo/badges/progress.js"></script><script src="../demo/badges/badges.js" data-mount=".top" data-mode="flow" data-current="2"></script>
<style>.ls-start.side{transform:translate(-100%,-50%)}.ls-start.side i{left:auto;right:-7px;bottom:auto;top:50%;margin:-7px 0 0;border:7px solid transparent;border-right:0;border-left-color:#f5b400}
.card .lbl{gap:8px}.card .lbl .ls-say{margin-left:4px;width:24px;height:24px}</style>
<script>
(function(){
  var titles=window.ASTRA_MODULE_TITLES, LP=window.lsProgress, st=document.querySelector(".stage"), hots=[].slice.call(document.querySelectorAll(".hot[data-arrow]"));
  function box(h){ return ["left","top","width","height"].map(function(k){ return parseFloat(h.style[k]); }); }
  function poly(h){ var b=box(h), m=h.style.clipPath.match(/[\d.]+% [\d.]+%/g);
    return m.map(function(pt){ var q=pt.split(" ").map(parseFloat); return (12.8*(b[0]+q[0]*b[2]/100)).toFixed(1)+","+(7.2*(b[1]+q[1]*b[3]/100)).toFixed(1); }).join(" "); }
  hots.forEach(function(h){ var m=+h.dataset.arrow, name=titles[m-1], b=box(h), status=LP.status(m);
    h.classList.toggle("is-current",status==="next"); if(status==="next") h.setAttribute("aria-current","true"); else h.removeAttribute("aria-current");
    h.title="Module "+m+": "+name;
    h.setAttribute("aria-label","Module "+m+": "+name+(status==="done"?", done":status==="next"?", start here":""));
    if(status==="done"){ var c=LP.check(); c.style.cssText="left:calc("+b[0]+"% - 14px);top:calc("+b[1]+"% - 4px);width:24px;height:24px"; st.appendChild(c); }
    if(status==="next"){ var t=LP.startTag("side"); t.style.cssText="left:calc("+b[0]+"% - 8px);top:"+(b[1]+b[3]/2)+"%"; st.appendChild(t);
      var pts=poly(h); [].forEach.call(document.querySelectorAll(".fx polygon"),function(pg){ pg.setAttribute("points",pts); });
      var A=document.querySelector(".go .place"), L=document.querySelector(".go .lesson"); A.textContent=name; L.textContent="Module "+m+": "+LP.lines[m-1]; }
    function pick(){
      window.lsBadges&&lsBadges.select(m-1);
      document.querySelector(".go .place").textContent=name;
      document.querySelector(".go .lesson").textContent="Module "+m+": "+LP.lines[m-1];
      hots.forEach(function(button){ button.setAttribute("aria-pressed",button===h?"true":"false"); });
    }
    h.addEventListener("click",pick);
  });
  hots.forEach(function(h){ h.setAttribute("aria-pressed",+h.dataset.arrow===LP.next?"true":"false"); });
})();
</script>
<script src="../demo/ambient.js?v=5" data-preset="d"></script>
<script src="../demo/proto/proto.js?v=9" data-page="d"></script>
</body>
</html>
