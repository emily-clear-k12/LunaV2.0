<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Plan E · Lost Library · Astra’s Writing Adventure</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../demo/switcher.css" />
<link rel="stylesheet" href="stage-fit.css" />
<link rel="preload" as="image" href="assets/library.jpg" />
<style>
  /* Plan E "Lost Library": explorer Astra finds the Library of the Long Lost Stories. Fixed 1366x768 stage (stage-fit.js).
     DRAFT ART: assets/library.jpg (and assets/worlds/*) are first-pass images.
     Six arched windows = six worlds, any order. Unfinished windows: dusty + faded (backdrop-filter clipped to the arch);
     finished (golden key collected): bright, restored, key in its keyhole. */
  :root {
    --frost: rgba(255, 248, 235, .82); --brown: #4a2e1a; --brown-soft: #7a5638;
    --gold: #d9a93f; --gold-deep: #94690f;
    --display: "Baloo 2", "Nunito", "Trebuchet MS", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { font-family: var(--display); color: var(--brown); -webkit-font-smoothing: antialiased; }
  .frost { background: var(--frost); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, .9); border-radius: 16px; color: var(--brown);
    box-shadow: 0 6px 18px rgba(30, 20, 8, .28), 0 1px 2px rgba(30, 20, 8, .18); }
  .scene { position: absolute; inset: 0; width: 1366px; height: 768px; overflow: hidden; background: #1d2a1a url("assets/library.jpg") center / cover no-repeat; }

  /* title + today's goal, top-left (open sky; Astra is lower-left) */
  .top { position: absolute; left: 16px; top: 14px; z-index: 20; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .title { display: flex; align-items: center; gap: 10px; padding: 6px 20px 6px 14px; border-radius: 999px; }
  .title svg { width: 26px; height: 26px; flex: none; }
  .title h1 { margin: 0; font-size: 26px; font-weight: 800; line-height: 1.05; white-space: nowrap; }
  .title h1 small { display: block; font-size: 14px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-deep); }
  .goal { display: flex; align-items: center; gap: 8px; padding: 5px 14px; border-radius: 999px; }
  .lbl { margin: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-deep); }
  .lbl svg { width: 14px; height: 14px; }
  .goal .txt { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.2; white-space: nowrap; }

  /* windows: the button is the arch; ::before = dust/fade (backdrop-filter of the painting behind, clipped to the arch) */
  .win { position: absolute; z-index: 10; padding: 0; border: 0; background: transparent; cursor: pointer;
    border-radius: var(--r) var(--r) 4px 4px; }
  .win .dust { position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    -webkit-backdrop-filter: grayscale(.8) sepia(.35) brightness(.7) contrast(.9); backdrop-filter: grayscale(.8) sepia(.35) brightness(.7) contrast(.9);
    background: radial-gradient(120% 80% at 50% 30%, rgba(196, 178, 150, .2), rgba(90, 76, 60, .3)),
                repeating-linear-gradient(115deg, rgba(220, 205, 180, .07) 0 3px, transparent 3px 9px);
    transition: opacity .9s ease, -webkit-backdrop-filter .25s ease, backdrop-filter .25s ease; }
  .win:hover .dust, .win:focus-visible .dust {
    -webkit-backdrop-filter: grayscale(.55) sepia(.25) brightness(.8) contrast(.95); backdrop-filter: grayscale(.55) sepia(.25) brightness(.8) contrast(.95); }
  .win .glow { position: absolute; inset: -6px; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .3s ease, box-shadow .3s ease;
    box-shadow: 0 0 0 2px rgba(255, 226, 150, .75), 0 0 22px 6px rgba(255, 205, 110, .45); }
  .win:hover .glow, .win:focus-visible .glow { opacity: 1; }
  .win:focus-visible { outline: none; }
  .win.done .dust { opacity: 0; }
  .win.done .glow { opacity: .75; box-shadow: 0 0 0 2px rgba(255, 220, 130, .8), 0 0 26px 8px rgba(255, 200, 90, .5); }
  .win.done:hover .glow, .win.done:focus-visible .glow { opacity: 1; }

  /* keyhole slot: dimmed when empty (tones down the painted key on window 1); golden key when done */
  .slot { position: absolute; z-index: 11; width: 30px; height: 40px; translate: -50% -50%; pointer-events: none; }
  .slot .shade { position: absolute; inset: 0; border-radius: 50% 50% 40% 40%; -webkit-backdrop-filter: grayscale(.9) brightness(.5); backdrop-filter: grayscale(.9) brightness(.5); transition: opacity .9s ease; }
  .slot.first { width: 46px; height: 46px; }
  .slot.first .shade { border-radius: 50%; }
  .slot svg { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; translate: -50% -50%; rotate: -35deg; opacity: 0; scale: .6;
    filter: drop-shadow(0 0 6px rgba(255, 210, 100, .9)); transition: opacity .6s ease .4s, scale .6s cubic-bezier(.3,1.6,.5,1) .4s; }
  .slot.done .shade { opacity: 0; }
  .slot.done svg { opacity: 1; scale: 1; }

  /* weathered stone plaques under each keyhole */
  .plaque { position: absolute; z-index: 12; translate: -50% 0; width: var(--pw, 96px); padding: 3px 6px 3px; border-radius: 6px; text-align: center; pointer-events: none;
    background: linear-gradient(#8f8170, #6d604f); border: 1px solid #b9a88f; box-shadow: inset 0 1px 0 rgba(255,255,255,.25), inset 0 -2px 3px rgba(0,0,0,.3), 0 3px 8px rgba(0,0,0,.45);
    color: #fbf1dc; text-shadow: 0 1px 1px rgba(0,0,0,.55); transition: background .6s ease, border-color .6s ease; }
  .plaque b { display: block; font-size: 12px; font-weight: 800; line-height: 1.08; }
  .plaque small { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; opacity: .9; margin-top: 1px; }
  .plaque.done { background: linear-gradient(#e7c066, #b8892e); border-color: #fbe3a0; color: #3d2608; text-shadow: 0 1px 0 rgba(255,240,200,.6); }
  .win:hover ~ .plaque, .plaque.hov { filter: brightness(1.12); }

  /* firefly swarm transition (code only) + world fade */
  #swarm { position: absolute; inset: 0; z-index: 80; width: 1366px; height: 768px; pointer-events: none; }
  .to-world { position: absolute; inset: 0; z-index: 90; background: #111 center / cover no-repeat; opacity: 0; pointer-events: none; transition: opacity .6s ease; }
  .to-world.on { opacity: 1; pointer-events: auto; }

  .reset { position: absolute; right: 14px; bottom: 10px; z-index: 20; padding: 3px 10px; border-radius: 999px; border: 0; background: rgba(20, 14, 8, .4);
    color: rgba(255, 245, 225, .85); font: 700 12px/1.3 var(--display); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .reset:hover { background: rgba(20, 14, 8, .6); color: #fff; }
  .reset:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .toast { position: absolute; left: 50%; bottom: 22px; z-index: 30; translate: -50% 0; padding: 8px 18px; border-radius: 999px; font-size: 17px; font-weight: 800;
    opacity: 0; transition: opacity .25s ease; pointer-events: none; }
  .toast.on { opacity: 1; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .win .dust, .slot svg, .slot .shade, .glow { transition: none; } }
</style>
</head>
<body>
<script src="../demo/switcher.js" data-page="dashboard-e"></script>
<div class="stage-frame" id="frame">
<main class="scene" id="scene" aria-label="The Library of the Long Lost Stories">
  <div class="top">
    <header class="title frost">
      <svg viewBox="0 0 26 26" aria-hidden="true"><path d="M3 6c4-2 7-2 10 1 3-3 6-3 10-1v15c-4-2-7-2-10 1-3-3-6-3-10-1z" fill="#fff3d6" stroke="#94690f" stroke-width="1.6" stroke-linejoin="round"/><path d="M13 7v15" stroke="#94690f" stroke-width="1.4"/><circle cx="18.5" cy="12" r="2.2" fill="none" stroke="#c99a2e" stroke-width="1.5"/><path d="M18.5 14.2v4.3M18.5 17h1.6" stroke="#c99a2e" stroke-width="1.5"/></svg>
      <h1>Astra’s Writing Adventure<small>Lost Library</small></h1>
    </header>
    <section class="goal frost" aria-label="Today's goal">
      <p class="lbl"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="#d9a93f" stroke-width="2"/><circle cx="8" cy="8" r="2.6" fill="#d9a93f"/></svg>Today’s goal</p>
      <p class="txt">Back up my opinion with strong, specific reasons.</p>
    </section>
  </div>
  <div id="windows"></div>
  <button type="button" class="reset" id="reset">Reset progress</button>
  <!-- HOOKS (not built yet): intro video + Replay intro / Skip intro, same pattern as Plans B and C (see LOST_LIBRARY.introVideo) -->
  <button type="button" class="replay" id="replayIntro" hidden>↺ Replay intro</button>
  <button type="button" class="skip" id="skipIntro" hidden>Skip intro ›</button>
  <div class="toast frost" id="toast" role="status" aria-live="polite"></div>
  <canvas id="swarm" width="1366" height="768" aria-hidden="true"></canvas>
  <div class="to-world" id="toWorld" aria-hidden="true"></div>
</main>
</div>
<script src="stage-fit.js"></script>
<script src="worlds.js"></script>
<script src="library.js"></script>
</body>
</html>
