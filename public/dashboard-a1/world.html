<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="icon" type="image/svg+xml" href="../favicon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../demo/switcher.css"/><link rel="stylesheet" href="stage-fit.css"/><link rel="stylesheet" href="common.css"/><title>Plan A.1 · World · Astra's Writing Adventure</title></head>
<body><script src="../demo/switcher.js" data-page="dashboard-a1"></script>
<div id="frame" class="stage-frame"></div>
<script src="stage-fit.js"></script><script src="worlds.js"></script>
<script>
(function(){
  var id=new URLSearchParams(location.search).get("w"), w=window.A1_WORLDS.filter(function(x){return x.id===id})[0]||window.A1_WORLDS[0], f=document.getElementById("frame");
  document.title=w.name+" · Plan A.1 · Astra's Writing Adventure"; f.style.setProperty("--c",w.color);
  var h='<a class="back" href="./?m='+w.id+'">‹ Back to the tree</a><div class="mod">MODULE '+w.m+' · <span>'+w.name+'</span></div>';
  if(w.art){ h='<img class="bg" src="'+w.art+'" alt="">'+h;
    w.crystals.forEach(function(c,i){ h+='<a class="crystal" style="left:'+c[0]+'px;top:'+c[1]+'px" href="'+(i===0?'../demo/lesson/':'#')+'" data-l="'+(i+1)+'"><span>Lesson '+(i+1)+'</span></a>'; });
    h+='<div class="toast" id="toast"></div>';
  } else h='<img class="bg blur" src="tree.jpg" alt="">'+h;
  f.innerHTML=h;
  [].forEach.call(f.querySelectorAll('.crystal[href="#"]'),function(a){ a.onclick=function(e){ e.preventDefault(); var t=document.getElementById("toast");
    t.textContent="Lesson "+a.dataset.l+" isn't open yet. Try Lesson 1!"; t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(function(){t.style.display="none"},2200); }; });
})();
</script></body></html>
