<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="icon" type="image/svg+xml" href="../favicon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../demo/switcher.css"/><link rel="stylesheet" href="stage-fit.css"/><link rel="stylesheet" href="common.css"/><title>Plan A.1 · Lantern Tree · Astra's Writing Adventure</title></head>
<body><script src="../demo/switcher.js" data-page="dashboard-a1"></script>
<div id="frame" class="stage-frame">
<img class="bg" src="tree.jpg" alt="Astra's lantern tree"/>
<div class="strip"><h1>Astra's Writing Adventure</h1></div>
<div id="lanterns"></div>
<div class="goaltile"><b>Today's goal</b>Back up every answer with evidence from the text.</div>
<div class="bar" id="bar"><div id="tiles" style="display:flex;gap:6px;flex:1;min-width:0"></div><div id="act"></div></div>
</div>
<script src="stage-fit.js"></script><script src="worlds.js"></script>
<script>
(function(){
  var W=window.A1_WORLDS, L=document.getElementById("lanterns"), bar=document.getElementById("bar"), tiles=document.getElementById("tiles"), act=document.getElementById("act"), sel=-1;
  W.forEach(function(w,i){
    var b=document.createElement("button"); b.className="lantern"; b.style.cssText="left:"+w.x+"px;top:"+w.y+"px;width:"+w.w+"px;height:"+w.h+"px;--c:"+w.color;
    b.setAttribute("aria-label","M"+w.m+" "+w.name); b.onclick=function(){pick(i)}; L.appendChild(b);
    var t=document.createElement("button"); t.className="tile"; t.style.setProperty("--c",w.color); t.innerHTML="<em>M"+w.m+"</em>"+w.name.replace(/'/g,"&#39;");
    t.onclick=function(){pick(i)}; tiles.appendChild(t);
  });
  function pick(i){ sel=i; bar.classList.add("show"); document.getElementById("frame").classList.add("sel");
    [].forEach.call(L.children,function(e,j){e.classList.toggle("on",j===i)}); [].forEach.call(tiles.children,function(e,j){e.classList.toggle("on",j===i)});
    var w=W[i]; act.innerHTML = w.art ? '<button class="go">Go ›</button>' : '<div class="soon"><b>Coming soon!</b>Astra is still exploring</div>';
    if(w.art) act.firstChild.onclick=function(){ location.href="world.html?w="+w.id; };
  }
  var q=new URLSearchParams(location.search).get("m"); if(q){ W.forEach(function(w,i){ if(w.id===q) pick(i); }); }
})();
</script></body></html>
