<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sandstone Canyon · Coming soon · Crystal Railways</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../demo/switcher.css" />
<style>
  /* Placeholder for the Sandstone Canyon world (Plan B demo destination). Fits 1366x768 with no scrolling. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "Baloo 2", "Nunito", system-ui, sans-serif; color: #4a2e1a;
    background: radial-gradient(120% 90% at 50% 40%, #f3d9a6, #d9a466 70%, #b77a44);
    display: grid; place-items: center;
  }
  html.vs-on body { padding-top: var(--vs-h); }
  .card {
    width: min(560px, 92vw); padding: 34px 40px 32px; text-align: center; border-radius: 22px;
    background: linear-gradient(180deg, #fbf3df, #f2e4c4);
    box-shadow: 0 2px 2px rgba(30, 18, 6, .3), 0 18px 40px rgba(80, 40, 10, .35);
    animation: in .6s ease-out both;
  }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
  img { width: 96px; height: 99px; display: block; margin: 0 auto 6px; filter: drop-shadow(0 3px 3px rgba(40, 26, 12, .3)); }
  .kicker { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: .16em; color: #94690f; }
  h1 { margin: 2px 0 4px; font-size: 44px; line-height: 1.05; font-weight: 800; color: #1d2b4f; }
  .soon { margin: 0 0 6px; font-size: 24px; font-weight: 800; color: #b5652a; }
  p.txt { margin: 0 0 22px; font-size: 18px; font-weight: 700; line-height: 1.3; }
  a.back {
    display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 26px; border-radius: 12px; text-decoration: none;
    background: linear-gradient(180deg, #27396b, #1d2b4f); border: 2px solid #c9d1dc; color: #fff8eb; font-size: 20px; font-weight: 800;
    box-shadow: inset 0 0 0 2px #1d2b4f, 0 4px 10px rgba(16, 24, 48, .35);
  }
  a.back:focus-visible { outline: 3px solid #d9a93f; outline-offset: 3px; }
  a.back svg { width: 20px; height: 20px; }
</style>
</head>
<body>
<script src="../../demo/switcher.js" data-page="dashboard-b"></script>
<main class="card">
  <img src="../assets/icons/sandstone-canyon.png" alt="" />
  <p class="kicker">CRYSTAL RAILWAYS · NEXT STOP</p>
  <h1>Sandstone Canyon</h1>
  <p class="soon">Coming soon!</p>
  <p class="txt">Astra and the train are on their way. This world is still being built.</p>
  <a class="back" href="../">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10H5M9 5.5 4.5 10 9 14.5" fill="none" stroke="#f3d68c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Back to the station
  </a>
</main>
</body>
</html>
